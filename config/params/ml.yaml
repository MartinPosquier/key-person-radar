# Owner: ml session. Defaults from the dossier.
seed: 42
cv:                                                 # dossier §9.5
  scheme: expanding
  first_train_end_year: 2017
  gap_sessions: 10
standard_shock:                                     # dossier §3.1
  z_wiki: 4.0
  tone_quantile_negative: 0.10
  tone_quantile_positive: 0.90
scores:                                             # dossier §3.3-3.5, §10
  window_years: 3
  shrinkage_k: 10
  smoothing_omega: 0.4
  max_yearly_change: 2.0
  agreement_min_spearman: 0.6
  bootstrap_samples: 200
  value_bootstrap_samples: 500
selection:                                          # dossier §9.6
  stability_bootstrap: 100
  stability_threshold: 0.8
finbert:
  model: ProsusAI/finbert
  batch_size: 32
features:                                           # dossier §9.2, task M2
  peak_z: 2.0                                       # a day counts in the peak while z_wiki > 2
  vol_window: 20                                    # sessions before J0 for the volatility
  ratio_window_days: 365                            # person/company views ratio, past year
  roles: [CEO, CFO, chair, founder, other]          # one-hot categories (persons.yaml)
  regions: [US, EU]
models:                                             # dossier §9.4, task M7
  scoring:                                          # GridSearchCV criterion on the CV folds
    regression: neg_mean_absolute_error
    classification: average_precision
  selection_metric: mae                             # model choice on the validation split
  grids:                                            # hyperparameters tuned by time-series CV
    lasso: {alpha: [1.0e-4, 3.0e-4, 1.0e-3, 3.0e-3, 1.0e-2]}
    elasticnet: {alpha: [1.0e-4, 1.0e-3, 1.0e-2], l1_ratio: [0.2, 0.5, 0.8]}
    rf: {n_estimators: [300], max_depth: [3, 6, null], min_samples_leaf: [20, 50]}
    hgb: {learning_rate: [0.03, 0.1], max_depth: [2, 3], max_iter: [200],
          l2_regularization: [0.0, 1.0]}
    logit: {C: [0.01, 0.1, 1.0], l1_ratio: [0.0, 0.5, 1.0]}
