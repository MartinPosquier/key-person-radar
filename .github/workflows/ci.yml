name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (without the heavy NLP stack)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt -r requirements/data.txt -r requirements/quant.txt -r requirements/ml.txt -r requirements/dev.txt
          pip install -e . --no-deps
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest
